<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>現場スケジュール管理 v2</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700;900&family=Roboto+Mono:wght@500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EEF2F1;--surface:#FFFFFF;--navy:#16323F;--navy-light:#1F4A5A;--navy-lighter:#2C5D6E;
  --teal:#2E8B84;--amber:#C9A227;--coral:#C4443A;--violet:#8464C4;--blue:#4C6EF5;
  --text:#1B2A2E;--text-mute:#5C6B6E;--text-faint:#8B979A;
  --border:#DCE3E1;--border-soft:#E7ECEA;
  --shadow:0 1px 2px rgba(22,50,63,.06),0 4px 12px rgba(22,50,63,.06);
  --shadow-lift:0 8px 20px rgba(22,50,63,.18);
  --staff-w:168px;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;height:100%;overflow:hidden;}
body{font-family:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic",sans-serif;background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased;}
.num{font-family:"Roboto Mono",monospace;}
.app{display:flex;height:100vh;}
.sidenav{width:76px;background:linear-gradient(180deg,var(--navy) 0%,#102530 100%);display:flex;flex-direction:column;align-items:center;padding:18px 0 14px;flex-shrink:0;}
.brand{width:38px;height:38px;border-radius:9px;background:var(--teal);display:flex;align-items:center;justify-content:center;font-weight:900;font-size:15px;color:#0E2B27;margin-bottom:26px;}
.navbtn{width:56px;padding:10px 4px;border-radius:9px;display:flex;flex-direction:column;align-items:center;gap:6px;color:#9FB4B4;cursor:pointer;font-size:11px;margin-bottom:6px;border:1px solid transparent;transition:background .15s,color .15s;text-align:center;line-height:1.3;}
.navbtn svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.7;}
.navbtn:hover{background:rgba(255,255,255,.06);color:#E7F2F1;}
.navbtn.active{background:var(--teal);color:#082623;font-weight:700;}
.sidenav .spacer{flex:1;}
.useravatar{width:44px;height:44px;border-radius:50%;background:var(--navy-lighter);color:#EAF5F3;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;border:2px solid var(--teal);cursor:pointer;}
.main{flex:1;display:flex;flex-direction:column;min-width:0;}
.topbar{background:var(--surface);border-bottom:1px solid var(--border);padding:10px 18px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;flex-shrink:0;min-height:58px;}
.topbar h1{font-size:15px;font-weight:700;margin:0;padding-right:12px;border-right:1px solid var(--border-soft);white-space:nowrap;}
.seg{display:flex;background:var(--bg);border-radius:8px;padding:3px;gap:2px;border:1px solid var(--border-soft);}
.seg button{border:none;background:transparent;padding:5px 11px;border-radius:6px;font-size:12px;font-weight:500;color:var(--text-mute);cursor:pointer;font-family:inherit;}
.seg button.active{background:var(--surface);color:var(--navy);font-weight:700;box-shadow:var(--shadow);}
.datenav{display:flex;align-items:center;gap:5px;}
.icobtn{width:27px;height:27px;border-radius:7px;border:1px solid var(--border);background:var(--surface);color:var(--text-mute);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:14px;}
.icobtn:hover{background:var(--bg);}
.todaybtn{border:1px solid var(--border);background:var(--surface);border-radius:7px;padding:4px 9px;font-size:12px;font-weight:500;cursor:pointer;color:var(--navy);font-family:inherit;}
.datelabel{font-size:13px;font-weight:700;color:var(--navy);white-space:nowrap;}
.spacer-flex{flex:1;}
.primary-btn{background:var(--navy);color:#fff;border:none;border-radius:7px;padding:6px 12px;font-size:12px;font-weight:700;cursor:pointer;font-family:inherit;display:flex;align-items:center;gap:4px;white-space:nowrap;}
.primary-btn:hover{background:var(--navy-light);}
.toggle-wrap{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--text-mute);white-space:nowrap;}
.toggle{width:32px;height:17px;border-radius:17px;background:var(--border);position:relative;cursor:pointer;transition:background .15s;flex-shrink:0;}
.toggle.on{background:var(--coral);}
.toggle .knob{position:absolute;top:2px;left:2px;width:13px;height:13px;border-radius:50%;background:#fff;transition:left .15s;box-shadow:0 1px 2px rgba(0,0,0,.25);}
.toggle.on .knob{left:17px;}
/* フィルターUI */
.view-filter{display:flex;align-items:center;gap:5px;font-size:11.5px;}
.filter-label{color:var(--text-faint);white-space:nowrap;}
.filter-seg{display:flex;background:var(--bg);border-radius:7px;padding:2px;gap:1px;border:1px solid var(--border-soft);}
.filter-seg button{border:none;background:transparent;padding:3px 9px;border-radius:5px;font-size:11.5px;font-weight:500;color:var(--text-mute);cursor:pointer;font-family:inherit;white-space:nowrap;}
.filter-seg button.active{background:var(--navy);color:#fff;font-weight:700;}
.multi-wrap{position:relative;}
.multi-btn{border:1px solid var(--border);background:#fff;border-radius:6px;padding:3px 8px;font-size:11.5px;font-weight:500;color:var(--text);cursor:pointer;font-family:inherit;white-space:nowrap;}
.multi-btn.sel{border-color:var(--navy);color:var(--navy);font-weight:700;}
.multi-dd{position:absolute;top:calc(100% + 4px);left:0;background:#fff;border:1px solid var(--border);border-radius:9px;box-shadow:var(--shadow-lift);padding:7px;min-width:165px;z-index:30;display:none;}
.multi-dd.open{display:block;}
.multi-dd label{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--text);cursor:pointer;padding:4px 5px;border-radius:5px;}
.multi-dd label:hover{background:var(--bg);}
/* content */
.content{flex:1;overflow:hidden;display:flex;flex-direction:column;padding:14px 16px 0;}
.legend{display:flex;gap:11px;flex-wrap:wrap;margin-bottom:9px;font-size:11.5px;color:var(--text-mute);flex-shrink:0;}
.legend span{display:inline-flex;align-items:center;gap:4px;}
.dot{width:8px;height:8px;border-radius:2px;display:inline-block;}
.csv-banner{background:#FFF7EC;border:1px solid #F0D88A;border-radius:7px;padding:7px 13px;font-size:12px;color:#7A5A00;margin-bottom:9px;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-shrink:0;}
/* ===== カレンダー共通：固定ヘッダー＋固定左列 =====
   構造（週/月とも同様）:
     .cal-wrap
       .cal-head-row  [display:grid]  ← 上固定（overflow親でsticky top:0）
         .cal-corner  ← 左固定（sticky left:0）
         .cal-day-head x N
       .cal-body-scroll  ← overflow:auto（縦横スクロール）
         .cal-body-row x M  [display:grid]
           .cal-name-cell  ← 左固定（sticky left:0）
           .cal-day-cell x N
*/
.cal-wrap{
  flex:1;overflow:auto;
  background:var(--surface);border:1px solid var(--border);border-radius:10px;
  box-shadow:var(--shadow);min-height:0;margin-bottom:14px;
}
.cal-head-row{
  display:flex;
  background:#FAFBFB;border-bottom:2px solid var(--border);
  position:sticky;top:0;z-index:10;
}
.cal-corner{
  width:var(--staff-w);min-width:var(--staff-w);flex-shrink:0;
  padding:7px 9px;border-right:2px solid var(--border);
  display:flex;flex-direction:column;gap:3px;
  background:#FAFBFB;
  position:sticky;left:0;z-index:12;
}
.cc-title{font-size:10.5px;color:var(--text-faint);}
.cc-ctrl{display:flex;gap:3px;align-items:center;flex-wrap:wrap;}
.cc-ctrl input{border:1px solid var(--border);border-radius:5px;padding:2px 6px;font-size:10.5px;font-family:inherit;width:82px;}
.cc-ctrl button{border:1px solid var(--border);border-radius:5px;padding:2px 5px;font-size:10px;cursor:pointer;background:#fff;color:var(--text-mute);white-space:nowrap;}
/* 日付列は「ヘッダー・会社行事・各人員行」で同一のグリッド定義を共有 → 列幅が行列で連動する */
.cal-inner{min-width:calc(var(--staff-w) + var(--nd,7)*var(--dmin,88px));}
.cal-head-days{flex:1;display:grid;grid-template-columns:repeat(var(--nd,7),minmax(var(--dmin,88px),1fr));min-width:calc(var(--nd,7)*var(--dmin,88px));}
.cal-day-head{flex:1;min-width:var(--dmin,88px);text-align:center;padding:7px 3px;border-left:1px solid var(--border-soft);}
.cal-day-head.cmp{padding:5px 0;}
.cal-day-head.cmp .dow{font-size:9.5px;}
.cal-day-head.cmp .dnum{font-size:12px;}
.cal-day-head.cmp.today .dnum{width:20px;height:20px;}
.cal-day-head .dow{font-size:10.5px;color:var(--text-faint);}
.cal-day-head .dnum{font-size:14px;font-weight:700;color:var(--navy);}
.cal-day-head.today .dnum{display:inline-flex;align-items:center;justify-content:center;width:23px;height:23px;border-radius:50%;background:var(--teal);color:#fff;}
.cal-day-head.sat .dow,.cal-day-head.sat .dnum{color:var(--blue);}
.cal-day-head.sun .dow,.cal-day-head.sun .dnum{color:var(--coral);}
.cal-body-scroll{}
/* 会社行事行 */
.cal-co-row{display:flex;border-bottom:1px solid var(--border-soft);background:#FFF7EC;}
.cal-co-label{width:var(--staff-w);min-width:var(--staff-w);padding:5px 9px;font-size:10.5px;color:var(--amber);font-weight:700;display:flex;align-items:center;border-right:1px solid var(--border-soft);position:sticky;left:0;z-index:4;background:#FFF7EC;}
.cal-co-cell{flex:1;min-width:var(--dmin,88px);border-left:1px solid var(--border-soft);padding:3px 4px;}
.company-chip{background:var(--amber);color:#3A2E05;font-size:10.5px;font-weight:700;border-radius:4px;padding:2px 5px;line-height:1.3;}
.cal-co-row.cmp .cal-co-cell{padding:3px 2px;}
.cal-co-row.cmp .company-chip{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:2px 4px;}
/* スタッフ行 */
.cal-body-row{display:grid;border-bottom:1px solid var(--border-soft);}
.cal-body-row:last-child{border-bottom:none;}
.cal-body-row.ua-row{background:#FBF7EE;}
.cal-name-cell{width:var(--staff-w);min-width:var(--staff-w);padding:7px 9px;font-size:12.5px;font-weight:600;color:var(--text);display:flex;align-items:flex-start;gap:6px;border-right:2px solid var(--border);position:sticky;left:0;z-index:6;background:var(--surface);}
.cal-body-row.ua-row .cal-name-cell{background:#FBF7EE;color:var(--amber);}
/* カレンダー（週/月）用の行：flex = [名前列 sticky] + [日付グリッド]。gridにするとstickyが効かないためflexを使う */
.cal-row{display:flex;border-bottom:1px solid var(--border-soft);}
.cal-row.ua-row{background:#FBF7EE;}
.cal-row.ua-row .cal-name-cell{background:#FBF7EE;color:var(--amber);}
.cal-row .cal-name-cell{align-items:center;}
.cal-row .cal-name-cell span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;}
.cal-row .avatar{margin-top:0;}
.avatar{width:23px;height:23px;border-radius:50%;background:var(--navy-lighter);color:#fff;font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:1px;}
.avatar.ua{background:#EFE1B9;color:#8A6D0E;}
/*
 * day cell + chip-layer
 * .cal-grid-body: 名前列を除いた日セル群のラッパー。position:relative でチップの基準点。
 * チップはこのラッパー内で left/right をパーセンテージで指定 → スクロール・リサイズ不問。
 */
.cal-day-cell{min-width:var(--dmin,88px);border-left:1px solid var(--border-soft);padding:0;}
.cal-day-cell.we{background:#F3F5F5;}
.cal-day-cell.editable{cursor:cell;}
.cal-day-cell.editable:hover{background:#EEF6F5;}
.cal-day-cell.dragover,.cal-day-cell.dragover:hover{background:#D6EEEA;box-shadow:inset 0 0 0 2px var(--teal);}
.cal-grid-body{
  /* グリッドの「日付列部分」だけを囲むラッパー */
  position:relative;
  flex:1;
  display:grid;
  grid-template-columns:repeat(var(--nd,7),minmax(var(--dmin,88px),1fr));
  min-width:calc(var(--nd,7)*var(--dmin,88px));
  overflow:hidden; /* 人員行の外にはみ出さない */
}
.chip-layer{
  position:absolute;top:0;left:0;right:0;bottom:0;
  pointer-events:none;
  /* 左右もクリップ: グリッドボディ外にはみ出さない */
  overflow:hidden;
}
.chip{
  position:absolute;border-radius:5px;padding:3px 7px;
  cursor:grab;font-size:11px;line-height:1.3;color:#fff;
  box-shadow:var(--shadow);border-left:3px solid rgba(0,0,0,.15);
  overflow:hidden;white-space:normal;word-break:break-all;
  pointer-events:auto;
}
.chip:active{cursor:grabbing;}
.chip.dragging{opacity:.35;}
.chip .ctitle{font-weight:700;display:block;}
.chip .ctime{opacity:.85;font-size:10px;display:block;}
.chip .creq{font-size:9.5px;font-weight:700;float:right;border-radius:3px;padding:0 3px;margin-left:3px;}
/* ── 案件チップ（週/月カレンダー） ──
   チップ自身を container にして、幅に応じて表示内容を段階的に減らす。
   最大幅：案件名（最大2行）＋時間 ／ 狭い：案件名のみ ／ さらに狭い：案件名だけ（人数バッジ非表示） */
.cal-row .chip{container-type:inline-size;display:flex;flex-direction:column;gap:1px;padding:3px 6px;cursor:pointer;}
.cal-row .chip[draggable="true"]{cursor:grab;}
.cal-row .chip:hover{filter:brightness(1.07);}
.cal-row .chip .crow{display:flex;align-items:flex-start;gap:4px;min-width:0;}
.cal-row .chip .ctitle{flex:1;min-width:0;font-weight:700;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;line-clamp:2;overflow:hidden;word-break:break-all;}
.cal-row .chip .creq{flex:none;float:none;margin:0;line-height:1.5;}
.cal-row .chip .ctime{display:block;font-size:10px;opacity:.9;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
@container (max-width:83px){
  .cal-row .chip .ctime{display:none;}
  .cal-row .chip .ctitle{-webkit-line-clamp:3;line-clamp:3;}
}
@container (max-width:48px){
  .cal-row .chip .creq{display:none;}
  .cal-row .chip .ctitle{font-size:10px;}
}
/* 月表示：1行のコンパクトチップ。十分広いときだけ時間も同じ行に出す */
.cal-row .chip.compact{flex-direction:row;align-items:center;gap:4px;padding:0 5px;}
.cal-row .chip.compact .crow{flex:1;align-items:center;}
.cal-row .chip.compact .ctitle{display:block;white-space:nowrap;text-overflow:ellipsis;font-size:10.5px;}
.cal-row .chip.compact .ctime{display:none;flex:none;}
@container (min-width:190px){
  .cal-row .chip.compact .ctime{display:block;}
}
/* 案件チップ：三行目（使用者）、必要人数到達チェック */
.cal-row .chip .cuser{display:block;font-size:10px;opacity:.9;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.cal-row .chip .cchk{position:absolute;top:2px;right:2px;}
.cchk{flex:none;width:15px;height:15px;border-radius:50%;background:#1E7B34;box-shadow:0 0 0 1.5px #fff;display:inline-flex;align-items:center;justify-content:center;}
.cchk svg{width:10px;height:10px;fill:none;stroke:#fff;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}
.cal-row .chip.ok .crow{padding-right:18px;}
.cal-row .chip.compact .cchk{width:13px;height:13px;top:50%;transform:translateY(-50%);}
.cal-row .chip.compact .cchk svg{width:9px;height:9px;}
.cal-row .chip.compact.ok .crow{padding-right:15px;}
@container (max-width:83px){
  .cal-row .chip .cuser{display:none;}
}
/* 月表示(compact)：狭いときは案件名のみ。十分広いときだけ時間・使用者も出す */
.cal-row .chip.compact .cuser{display:none;flex:none;}
@container (min-width:190px){
  .cal-row .chip.compact .cuser{display:block;}
}
@container (max-width:48px){
  .cal-row .chip.ok .crow{padding-right:0;}
}
/* 設備行 */
.eqav{background:#5C6B6E;}
.cal-row .nm{min-width:0;}
.cal-row .nm1{font-size:12px;font-weight:600;line-height:1.3;word-break:break-all;}
.cal-row .nm2{font-size:10px;color:var(--text-faint);font-weight:400;margin-top:1px;}
.hint{font-size:11.5px;color:var(--text-mute);margin:-6px 0 11px;line-height:1.6;}
.perm-matrix{width:100%;border-collapse:collapse;margin:2px 0 12px;font-size:11.5px;}
.perm-matrix th,.perm-matrix td{border:1px solid var(--border-soft);padding:5px 8px;text-align:center;}
.perm-matrix th{background:#FAFBFB;color:var(--text-mute);font-weight:700;}
.perm-matrix td:first-child,.perm-matrix th:first-child{text-align:left;}
.pw-row{display:flex;gap:6px;}
.pw-row input{flex:1;min-width:0;}
.pw-row button{flex:none;}
.field .fnote{font-size:11px;color:var(--text-faint);margin-top:4px;line-height:1.5;}
.perm-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:4px 10px;}
.perm-list label{display:flex;align-items:center;gap:7px;font-size:12.5px;cursor:pointer;padding:3px 4px;border-radius:5px;white-space:nowrap;}
.perm-list label:hover{background:var(--bg);}
.perm-list input{margin:0;}
.perm-list small{color:var(--text-faint);font-size:10.5px;}
.res-summary{background:var(--bg);border:1px solid var(--border-soft);border-radius:8px;padding:8px 11px;font-size:12.5px;line-height:1.8;}
.res-summary b{display:inline-block;min-width:3.6em;color:var(--text-mute);font-weight:600;}
/* 24h日表示：単一スクロールコンテナ(.cal-wrap)＋sticky。時刻ヘッダーと各行のトラックは同じ幅・同じ24等分 → 時刻と案件がずれない */
.cal-inner.day24{min-width:calc(var(--staff-w) + 960px);}
.day24-hh{flex:1;display:grid;grid-template-columns:repeat(24,1fr);min-width:960px;}
.day24-hcell{text-align:left;font-size:9.5px;color:var(--text-faint);padding:4px 0 4px 4px;border-left:1px solid var(--border-soft);}
.day24-track{position:relative;flex:1;min-width:960px;overflow:hidden;}
.hour-line{position:absolute;top:0;bottom:0;width:1px;background:var(--border-soft);}
.day24-chip{position:absolute;border-radius:5px;color:#fff;font-size:10.5px;padding:3px 6px;overflow:hidden;box-shadow:var(--shadow);cursor:pointer;border-left:3px solid rgba(0,0,0,.15);}
.day24-chip .ctitle{font-weight:700;font-size:11px;display:block;}
.day24-chip .ctime{opacity:.85;font-size:10px;}
.day24-chip .cchk{position:static;display:inline-block;vertical-align:-3px;margin-left:3px;}
/* 月表示 */
.month-outer{flex:1;overflow:hidden;display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--border);border-radius:10px;box-shadow:var(--shadow);min-height:0;margin-bottom:14px;}
.month-head{display:flex;flex-shrink:0;background:#FAFBFB;border-bottom:2px solid var(--border);}
.month-corner{width:var(--staff-w);min-width:var(--staff-w);border-right:2px solid var(--border);padding:7px 9px;display:flex;flex-direction:column;gap:3px;position:sticky;left:0;z-index:5;background:#FAFBFB;}
.month-scroll{flex:1;overflow:auto;}
.month-body-row{display:flex;border-bottom:1px solid var(--border-soft);}
.month-body-row:last-child{border-bottom:none;}
.month-body-row.ua-row{background:#FBF7EE;}
.month-name-cell{width:var(--staff-w);min-width:var(--staff-w);border-right:2px solid var(--border);padding:5px 9px;font-size:12px;font-weight:600;display:flex;align-items:center;gap:5px;position:sticky;left:0;z-index:4;background:var(--surface);}
.month-body-row.ua-row .month-name-cell{background:#FBF7EE;color:var(--amber);}
.month-dow-cell{padding:5px 0;text-align:center;font-size:10.5px;border-left:1px solid var(--border-soft);}
.month-day-cell{border-left:1px solid var(--border-soft);padding:3px 3px;overflow:hidden;min-height:44px;}
.month-day-cell.other-m{opacity:.38;}
.mdate{font-size:10px;font-weight:700;color:var(--text-mute);margin-bottom:2px;}
.mdate.today-d{display:inline-flex;width:16px;height:16px;border-radius:50%;background:var(--teal);color:#fff;align-items:center;justify-content:center;font-size:9.5px;}
.mchip{font-size:10px;border-radius:3px;padding:2px 4px;margin-bottom:3px;color:#fff;font-weight:600;word-break:break-all;cursor:pointer;line-height:1.25;display:block;}
.mchip:last-child{margin-bottom:0;}
/* modal */

function dayDiff(a,b){return Math.round((fromISO(b)-fromISO(a))/86400000);}
function sameDate(a,b){return a.getFullYear()===b.getFullYear()&&a.getMonth()===b.getMonth()&&a.getDate()===b.getDate();}
function esc(s){return(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function initials(n){return n?n[0]:'?';}
function timeToMin(t){if(!t||t==='終日')return null;const[h,m]=(t||'').split(':').map(Number);return h*60+(m||0);}
function normDigits(v){return String(v||'').replace(/[０-９]/g,c=>String.fromCharCode(c.charCodeAt(0)-65248)).replace(/[^0-9]/g,'');}
function currentUser(){return ACCOUNTS.find(a=>a.id===state.currentUserId)||null;}
/* 権限の判定
   master＝最高権限者 / admin＝管理者 / editor＝一般 / viewer＝閲覧 */
function canEdit(){const u=currentUser();return !!u&&u.role!=='viewer';}                       // 案件の追加・編集、設備の予約
function canEditSettings(){const u=currentUser();return !!u&&(u.role==='master'||u.role==='admin');} // 設備マスタ・スタッフ・カテゴリ等の設定
function isMaster(){const u=currentUser();return !!u&&u.role==='master';}                       // アカウント作成・権限付与
function roleLabel(r){return (ROLES[r]||{}).label||'—';}
function masterCount(){return ACCOUNTS.filter(a=>a.role==='master').length;}
function assignOk(p){return p.assigned.length>=p.required;}
function reqTxt(p){return p.assigned.length+'/'+p.required;}
function okBg(ok){return ok?'rgba(0,100,0,0.25)':'rgba(150,0,0,0.35)';}

function visibleStaff(){
  let list=[...STAFF];
  const q=state.staffSearch.trim();
  if(q) list=list.filter(s=>s.name.includes(q));
  list.sort((a,b)=>{const r=a.name.localeCompare(b.name,'ja');return state.staffSortAsc?r:-r;});
  if(state.filterMode==='mine'){const sid=currentUser()?.staffId;if(sid)list=list.filter(s=>s.id===sid);}
  else if(state.filterMode==='select'&&state.filterSelected.length>0)list=list.filter(s=>state.filterSelected.includes(s.id));
  return list;
}
function projs4staff(sid){return PROJECTS.filter(p=>p.assigned.includes(sid));}
function unassignedProjs(){
  if(state.filterMode==='mine'||state.filterMode==='select')return[];
  return PROJECTS.filter(p=>p.assigned.length===0);
}

  state.currentUserId=acc.id;

}

/* ── CSV ── */
function hasOldData(){const c=toISO(addDays(TODAY,-180));return PROJECTS.some(p=>p.end<c);}
function exportOldCSV(){
  const c=toISO(addDays(TODAY,-180));
  const old=PROJECTS.filter(p=>p.end<c);
  if(!old.length){alert('エクスポート対象の過去データはありません。');return;}
  const rows=[['ID','案件名','カテゴリ','開始日','終了日','開始時刻','終了時刻','必要人数','担当','住所','メモ']];
  old.forEach(p=>rows.push([p.id,p.title,getCat(p.category).label,p.start,p.end,p.stime,p.etime,p.required,p.assigned.map(staffName).join('|'),p.address||'',p.memo]));
  const csv=rows.map(r=>r.map(v=>`"${String(v).replace(/"/g,'""')}"`).join(',')).join('\n');
  const blob=new Blob(['\uFEFF'+csv],{type:'text/csv;charset=utf-8'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');a.href=url;a.download='old_projects.csv';a.click();
  URL.revokeObjectURL(url);
  PROJECTS=PROJECTS.filter(p=>p.end>=c);renderAll();
}

function shiftCal(dir){
  forceResetScroll=true;
  if(state.view==='week')state.cursorDate=addDays(state.cursorDate,dir*7);
  else if(state.view==='day')state.cursorDate=addDays(state.cursorDate,dir);
  else state.cursorDate=new Date(state.cursorDate.getFullYear(),state.cursorDate.getMonth()+dir,1);
  renderAll();
}
function shiftEq(dir){
  forceResetScroll=true;
  if(state.eqView==='week')state.eqCursorDate=addDays(state.eqCursorDate,dir*7);
  else if(state.eqView==='day')state.eqCursorDate=addDays(state.eqCursorDate,dir);
  else state.eqCursorDate=new Date(state.eqCursorDate.getFullYear(),state.eqCursorDate.getMonth()+dir,1);
  renderAll();
}

function cornerHtml(label){
  return `<div class="cc-title">${label}</div><div class="cc-ctrl"><input type="text" id="ssi" placeholder="名前で検索" value="${esc(state.staffSearch)}"><button id="ssb">名前${state.staffSortAsc?'↑':'↓'}</button></div>`;
}
function attachStaffCtrl(){
  const si=document.getElementById('ssi');
  if(si){
    /* 再描画で入力欄が作り直されても、フォーカスとカーソル位置を戻す。IME変換中（未確定）は再描画しない。 */
    let composing=false;
    const apply=()=>{
      const pos=si.selectionStart;
      state.staffSearch=si.value;renderAll();
      const n=document.getElementById('ssi');
      if(n){n.focus();try{n.setSelectionRange(pos,pos);}catch(e){}}
    };
    si.addEventListener('compositionstart',()=>{composing=true;});
    si.addEventListener('compositionend',()=>{composing=false;apply();});
    si.addEventListener('input',e=>{if(composing||e.isComposing)return;apply();});
  }
  const sb=document.getElementById('ssb');
  if(sb)sb.addEventListener('click',()=>{state.staffSortAsc=!state.staffSortAsc;renderAll();});
}

/* 案件カレンダー */
function renderProjectCal(rs,numDays,dmin,compact){
  const staffList=visibleStaff();
  let topHtml=legendHtml();
  if(hasOldData())topHtml+=`<div class="csv-banner">半年以上前のデータがあります。<button class="btn btn-sm btn-ghost" id="csvBtn">CSVエクスポート</button></div>`;
  const rangeStart=toISO(rs),rangeEnd=toISO(addDays(rs,numDays-1));
  const inRange=p=>p.start<=rangeEnd&&p.end>=rangeStart;
  const rows=[projectRow('unassigned','未配置',unassignedProjs().filter(inRange),true)];
  staffList.forEach(st=>rows.push(projectRow(st.id,st.name,projs4staff(st.id).filter(inRange),false)));
  renderRange(rs,numDays,dmin,compact,{
    topHtml,corner:cornerHtml('スタッフ'),showCompany:true,rows,
    editable:canEdit(),addLabel:'案件を追加',
    onCellClick:(rowId,date)=>openProjectModal(null,{date,staffId:rowId}),
    onChipClick:id=>openProjectModal(id),
    onDrop:moveProject,
    after:attachStaffCtrl,
  });
}
function projectRow(rowId,label,projs,isUA){
  /* 重複チェック（同日開始の案件同士） */
  for(let i=0;i<projs.length-1;i++){
    for(let j=i+1;j<projs.length;j++){
      const a=projs[i],b=projs[j];
      if(a.start!==b.start)continue;
      const as=timeToMin(a.stime),ae=timeToMin(a.etime),bs=timeToMin(b.stime),be=timeToMin(b.etime);
      if(as!==null&&bs!==null&&ae!==null&&be!==null&&as<be&&ae>bs)
        showWarn('時間重複',label+'：「'+a.title+'」と「'+b.title+'」が重複しています');
    }
  }
  return {
    rowId,label,isUA,
    nameHtml:`<div class="avatar ${isUA?'ua':''}">${isUA?'!':initials(label)}</div><span>${esc(label)}</span>`,
    chips:projs.map(p=>{
      const cat=getCat(p.category);const ok=assignOk(p);
      const tl=p.stime==='終日'?'終日':(p.stime?(p.stime+(p.etime?'〜'+p.etime:'')):'');
      return {
        id:p.id,start:p.start,end:p.end,sortKey:timeToMin(p.stime)||0,color:cat.color,
        title:p.title,time:tl,sub:'',
        badge:{text:reqTxt(p),bg:okBg(ok)},check:ok,
        tip:p.title+'（'+reqTxt(p)+'）'+(tl?'　'+tl:''), // 縮小時のポップアップ：案件名の右に必要人数
      };
    }),
  };
}

  inner.style.setProperty('--dmin',dmin+'px');

  headRow.className='cal-head-row';
  const corner=document.createElement('div');corner.className='cal-corner';corner.innerHTML=cfg.corner;
  headRow.appendChild(corner);
  const headDays=document.createElement('div');headDays.className='cal-head-days';
  days.forEach(d=>{
    const wd=d.getDay();const cls=sameDate(d,TODAY)?'today':(wd===0?'sun':wd===6?'sat':'');

    cell.innerHTML=`<div class="dow">${DOW[wd]}</div><div class="dnum num">${d.getDate()}</div>`;

  });

    const coRow=document.createElement('div');coRow.className='cal-co-row'+(compact?' cmp':'');
    const coL=document.createElement('div');coL.className='cal-co-label';coL.textContent='会社行事';coRow.appendChild(coL);
    const coDays=document.createElement('div');coDays.className='cal-head-days';
    days.forEach(d=>{
      const cell=document.createElement('div');cell.className='cal-co-cell';
      COMPANY_EVENTS.filter(e=>e.date===toISO(d)).forEach(ev=>{
        const c=document.createElement('div');c.className='company-chip';c.title=ev.title+'　'+ev.time;c.textContent=ev.title;cell.appendChild(c);
      });
      coDays.appendChild(cell);
    });
    coRow.appendChild(coDays);
    inner.appendChild(coRow);
  }

  const ctx={rs,numDays,days,compact,cfg};
  cfg.rows.forEach(r=>buildRow(inner,r,ctx));
  if(cfg.after)cfg.after();
}

/*
 * buildRow
 *   .cal-row  [flex]
 *     .cal-name-cell  [sticky left:0]            ← 名前列（固定）
 *     .cal-grid-body  [relative, flex:1, overflow:hidden]
 *       .cal-day-cell × numDays                  ← クリックで新規作成 / ドロップ先
 *       .chip-layer [absolute inset:0]           ← チップ（left/right を % 指定）
 * チップは grid-body の overflow:hidden により、行・日付範囲の外へ出ない。
 * 行の高さ = 上余白 + レーン数分のチップ + 下余白(CLICK_GAP)。下余白はセルの空白クリック用。
 */
function buildRow(parent,row,ctx){
  const {rs,numDays,days,compact,cfg}=ctx;
  const items=[];
  row.chips.forEach(c=>{
    const s=Math.max(0,dayDiff(toISO(rs),c.start));
    const e=Math.min(numDays-1,dayDiff(toISO(rs),c.end));
    if(e<0||s>=numDays)return;
    items.push({c,s,e});
  });
  items.sort((a,b)=>a.s!==b.s?a.s-b.s:a.c.sortKey-b.c.sortKey);
  const laneEnd=[];
  items.forEach(it=>{
    let li=laneEnd.findIndex(v=>it.s>v);
    if(li===-1){laneEnd.push(it.e);li=laneEnd.length-1;}
    else laneEnd[li]=it.e;
    it.lane=li;
  });
  const laneCount=laneEnd.length;
  const LANE_H=compact?22:(row.laneH||50),PAD=4,GAP=compact?3:4,CLICK_GAP=compact?10:14;
  const MIN_H=compact?(row.minHc||34):(row.minH||40);
  const ROW_H=Math.max(MIN_H,laneCount?PAD+laneCount*LANE_H+(laneCount-1)*GAP+CLICK_GAP:0);

  const tr=document.createElement('div');
  tr.className='cal-row'+(row.isUA?' ua-row':'');
  tr.style.minHeight=ROW_H+'px';

  const nc=document.createElement('div');nc.className='cal-name-cell';nc.title=row.label;
  nc.innerHTML=row.nameHtml;
  tr.appendChild(nc);

  const body=document.createElement('div');
  body.className='cal-grid-body';
  body.style.minHeight=ROW_H+'px';

  const editable=!!cfg.editable;
  for(let i=0;i<numDays;i++){
    const wd=days[i].getDay();
    const cell=document.createElement('div');
    cell.className='cal-day-cell'+((wd===0||wd===6)?' we':'')+(editable?' editable':'');
    cell.dataset.row=row.rowId;cell.dataset.dayidx=i;
    if(editable){
      cell.title=`${row.label}　${days[i].getMonth()+1}/${days[i].getDate()}（${DOW[wd]}）― クリックで${cfg.addLabel}`;
      cell.addEventListener('click',()=>cfg.onCellClick(row.rowId,toISO(days[i])));
    }
    body.appendChild(cell);
  }

  const layer=document.createElement('div');layer.className='chip-layer';
  items.forEach(it=>{
    const c=it.c;
    const leftPct =(it.s/numDays*100).toFixed(4);
    const rightPct=((numDays-it.e-1)/numDays*100).toFixed(4);
    const top=PAD+it.lane*(LANE_H+GAP);
    const chip=document.createElement('div');
    chip.className='chip'+(compact?' compact':'')+(c.check?' ok':'');chip.dataset.id=c.id;
    chip.title=c.tip||c.title;
    chip.style.cssText=`background:${c.color};left:calc(${leftPct}% + 4px);right:calc(${rightPct}% + 4px);top:${top}px;height:${LANE_H}px;`;
    if(editable)chip.draggable=true;
    const badge=c.badge?`<span class="creq" style="background:${c.badge.bg}">${esc(c.badge.text)}</span>`:'';
    const chk=c.check?`<span class="cchk" title="必要人数に達しています"><svg viewBox="0 0 12 12"><path d="M2.6 6.3l2.2 2.2 4.6-4.9"/></svg></span>`:'';
    chip.innerHTML=`<div class="crow"><span class="ctitle">${esc(c.title)}</span>${badge}</div>${c.time?`<span class="ctime">${esc(c.time)}</span>`:''}${c.sub?`<span class="cuser">${esc(c.sub)}</span>`:''}${chk}`;
    chip.addEventListener('click',()=>cfg.onChipClick(c.id));
    if(editable){
      chip.addEventListener('dragstart',e=>{
        dragInfo={id:c.id,rowId:row.rowId};
        e.dataTransfer.setData('text/plain',String(c.id));
        e.dataTransfer.effectAllowed='move';
        chip.classList.add('dragging');
      });
      chip.addEventListener('dragend',()=>{chip.classList.remove('dragging');clearDropTarget();dragInfo=null;});
    }
    layer.appendChild(chip);
  });
  body.appendChild(layer);

  /* ドロップ：既存チップの上に落としても「セル」を優先して判定するため、行全体で受けてX座標から日付列を割り出す */
  if(editable){
    const dayIdxOf=e=>{
      const r=body.getBoundingClientRect();
      const x=Math.min(Math.max(e.clientX-r.left,0),r.width-1);
      return Math.floor(x/r.width*numDays);
    };
    body.addEventListener('dragover',e=>{
      if(!dragInfo)return;
      e.preventDefault();e.dataTransfer.dropEffect='move';
      setDropTarget(body.children[dayIdxOf(e)]);
    });
    body.addEventListener('dragleave',e=>{if(!body.contains(e.relatedTarget))clearDropTarget();});
    body.addEventListener('drop',e=>{
      e.preventDefault();clearDropTarget();
      if(!dragInfo)return;
      const info=dragInfo;dragInfo=null;
      cfg.onDrop(info.id,info.rowId,row.rowId,toISO(days[dayIdxOf(e)]));
    });
  }

  tr.appendChild(body);
  parent.appendChild(tr);
}

function setDropTarget(cell){
  document.querySelectorAll('.cal-day-cell.dragover').forEach(c=>{if(c!==cell)c.classList.remove('dragover');});

/* ── 時間重複判定 ── */
function isAllDayProj(p){return p.stime==='終日'||!p.stime;}
function timeOverlap(a,b){
  if(isAllDayProj(a)||isAllDayProj(b))return true;
  const as=timeToMin(a.stime),ae=timeToMin(a.etime)??as+60,bs=timeToMin(b.stime),be=timeToMin(b.etime)??bs+60;
  return as<be&&ae>bs;
}
function findTimeConflicts(p,staffIds){
  const out=[];
  staffIds.forEach(sid=>{
    PROJECTS.forEach(q=>{
      if(q.id===p.id||!q.assigned.includes(sid))return;
      if(q.start>p.end||q.end<p.start)return; // 日付が重ならない
      if(timeOverlap(p,q))out.push({sid,q});
    });
  });
  return out;
}

/* 案件ドロップ：日付だけ自動変更（期間の長さは維持）／時間は変更しない／時間重複があればアラート */
function moveProject(pid,srcRow,dstRow,targetDate){
  const p=PROJECTS.find(x=>x.id===pid);if(!p)return;
  if(p.start===targetDate&&srcRow===dstRow)return;
  const dur=dayDiff(p.start,p.end);
  p.start=targetDate;p.end=toISO(addDays(fromISO(targetDate),dur));
  const next=p.assigned.filter(x=>x!==srcRow);
  if(dstRow!=='unassigned'&&!next.includes(dstRow))next.push(dstRow);
  p.assigned=next;
  renderAll();
  const conflicts=dstRow==='unassigned'?[]:findTimeConflicts(p,[dstRow]);
  if(conflicts.length){
    const c=conflicts[0];
    showWarn('時間重複',`${staffName(c.sid)}：「${p.title}」が「${c.q.title}」と時間が重複しています`+(conflicts.length>1?`（他${conflicts.length-1}件）`:''));
  }
}

function buildDay24Row(rowId,label,projs,isUA){
  for(let i=0;i<projs.length-1;i++)for(let j=i+1;j<projs.length;j++){
    const a=projs[i],b=projs[j];
    const as=timeToMin(a.stime),ae=timeToMin(a.etime),bs=timeToMin(b.stime),be=timeToMin(b.etime);
    if(as!==null&&bs!==null&&ae!==null&&be!==null&&as<be&&ae>bs)
      showWarn('時間重複',label+'：「'+a.title+'」と「'+b.title+'」が重複しています');
  }
  /* 時間帯が重なる案件は縦に積む */
  const items=projs.map(p=>{
    const sm=timeToMin(p.stime),em=timeToMin(p.etime);
    const s=sm===null?0:sm/1440,e=sm===null?1:Math.max(s+0.02,((em??sm+60))/1440);
    return {p,sm,s,e};
  }).sort((a,b)=>a.s-b.s);
  const laneEnd=[];
  items.forEach(it=>{
    let li=laneEnd.findIndex(v=>it.s>=v);
    if(li===-1){laneEnd.push(it.e);li=laneEnd.length-1;}else laneEnd[li]=it.e;
    it.lane=li;
  });
  const CH=40,PAD=4,GAP=4;
  const H=Math.max(52,laneEnd.length?PAD*2+laneEnd.length*CH+(laneEnd.length-1)*GAP:0);

  const row=document.createElement('div');row.className='cal-row'+(isUA?' ua-row':'');row.style.minHeight=H+'px';
  const nl=document.createElement('div');nl.className='cal-name-cell';nl.title=label;
  nl.innerHTML=`<div class="avatar ${isUA?'ua':''}">${isUA?'!':initials(label)}</div><span>${esc(label)}</span>`;
  row.appendChild(nl);
  const track=document.createElement('div');track.className='day24-track';track.style.minHeight=H+'px';
  for(let h=1;h<24;h++){const l=document.createElement('div');l.className='hour-line';l.style.left=(h/24*100).toFixed(4)+'%';track.appendChild(l);}
  items.forEach(it=>{
    const p=it.p;const cat=getCat(p.category);const ok=assignOk(p);
    const chip=document.createElement('div');chip.className='day24-chip';chip.dataset.pid=p.id;chip.style.background=cat.color;
    chip.style.top=(PAD+it.lane*(CH+GAP))+'px';chip.style.height=CH+'px';chip.style.bottom='auto';
    chip.title=p.title+'（'+reqTxt(p)+'）';
    if(it.sm===null){chip.style.left='0%';chip.style.width='100%';chip.style.opacity='0.75';}
    else{chip.style.left=(it.s*100).toFixed(4)+'%';chip.style.width=((it.e-it.s)*100).toFixed(4)+'%';}
    const chk=ok?`<span class="cchk" title="必要人数に達しています"><svg viewBox="0 0 12 12"><path d="M2.6 6.3l2.2 2.2 4.6-4.9"/></svg></span>`:'';
    chip.innerHTML=`<span class="ctitle">${esc(p.title)} <span style="background:${okBg(ok)};border-radius:3px;padding:0 3px;font-size:9px;">${esc(reqTxt(p))}</span>${chk}</span><span class="ctime">${it.sm===null?'終日':esc(p.stime)+'〜'+esc(p.etime)}</span>`;
    track.appendChild(chip);
  });
  row.appendChild(track);return row;
}

/* 予約ドロップ：日付・設備を変更（期間の長さと時間は維持）。保有数を超える場合はアラート */
function moveReservation(rid,srcRow,dstRow,targetDate){
  const r=RESERVATIONS.find(x=>x.id===rid);if(!r)return;
  if(r.start===targetDate&&r.equipmentId===dstRow)return;
  const dur=dayDiff(r.start,r.end);
  r.start=targetDate;r.end=toISO(addDays(fromISO(targetDate),dur));
  r.equipmentId=dstRow;
  renderAll();
  warnStock(r);
}
/* 同じ設備・重なる日時の予約数量の合計が保有数を超えていないか（日ごとに判定） */
function stockOverflow(r){
  const eq=EQUIPMENT.find(e=>e.id===r.equipmentId);if(!eq)return null;
  const others=RESERVATIONS.filter(q=>q.id!==r.id&&q.equipmentId===r.equipmentId&&q.start<=r.end&&q.end>=r.start&&timeOverlap(q,r));
  for(let d=fromISO(r.start);toISO(d)<=r.end;d=addDays(d,1)){
    const k=toISO(d);
    const sum=(Number(r.qty)||1)+others.filter(q=>q.start<=k&&q.end>=k).reduce((a,q)=>a+(Number(q.qty)||1),0);
    if(sum>eq.qty)return {eq,date:k,sum};
  }
  return null;
}
function warnStock(r){
  const ov=stockOverflow(r);
  if(ov)showWarn('保有数を超えています',`${ov.eq.name}：${fmtMD(ov.date)}の予約数量が合計${ov.sum}で、保有数（${ov.eq.qty}）を超えています`);
}

/* ── 日付・時刻・終日の連動（案件／設備予約モーダル共通） ──
   複数日にまたがる場合は自動で終日（変更不可）。単日のときだけ「終日」を選べる。 */
function bindDateTime(ro,initAllDay,ids){
  const g=id=>document.getElementById(id);
  const fStart=g(ids.s),fEnd=g(ids.e),fSt=g(ids.st),fEt=g(ids.et),fAll=g(ids.all),fNote=g(ids.note);
  let userAllDay=initAllDay;
  const isMulti=()=>!!(fStart.value&&fEnd.value&&fEnd.value>fStart.value);
  const sync=()=>{
    const multi=isMulti();
    if(multi){fAll.checked=true;fAll.disabled=true;fNote.textContent='複数日にまたがるため自動で終日になります';}
    else{fAll.checked=userAllDay;fAll.disabled=ro;fNote.textContent='';}
    fSt.disabled=fEt.disabled=fAll.checked||ro;
  };
  fAll.addEventListener('change',()=>{userAllDay=fAll.checked;sync();});
  if(!ro){
    fStart.addEventListener('change',()=>{if(fEnd.value&&fEnd.value<fStart.value)fEnd.value=fStart.value;sync();});
    fEnd.addEventListener('change',()=>{if(fStart.value&&fEnd.value<fStart.value)fStart.value=fEnd.value;sync();});
  }
  sync();
  return {sync,isAllDay:()=>isMulti()||fAll.checked,setUserAllDay:v=>{userAllDay=v;sync();}};
}
const isTimeStr=v=>/^\d{1,2}:\d{2}$/.test(v||'');
const padTime=v=>isTimeStr(v)?(v.length===4?'0'+v:v):'';

  const root=document.getElementById('modalRoot');
  root.innerHTML=`<div class="overlay" id="ov"><div class="modal"><div class="modal-head"><h2>${isNew?'設備を予約':ro?'設備予約の詳細':'設備予約の詳細・編集'}</h2><span class="x" id="cX">✕</span></div><div class="modal-body"><div class="res-summary" id="r_sum"></div><div class="field"><label>設備</label><select id="r_eq" ${ro?'disabled':''}>${EQUIPMENT.map(e=>`<option value="${e.id}" ${r.equipmentId===e.id?'selected':''}>${esc(e.name)}（保有${e.qty}）</option>`).join('')}</select></div><div class="row2"><div class="field"><label>使用者</label><select id="r_user" ${ro?'disabled':''}><option value="">（未設定）</option>${STAFF.map(s=>`<option value="${s.id}" ${r.userId===s.id?'selected':''}>${esc(s.name)}</option>`).join('')}</select></div><div class="field"><label>数量</label><input type="number" id="r_qty" value="${r.qty}" min="1" ${ro?'readonly':''}></div></div><div class="field"><label>案件</label><select id="r_prj" ${ro?'disabled':''}><option value="">（未設定）</option>${projOpts}</select></div><div class="row2"><div class="field"><label>開始日</label><input type="date" id="r_start" value="${r.start}" ${ro?'readonly':''}></div><div class="field"><label>終了日</label><input type="date" id="r_end" value="${r.end}" ${ro?'readonly':''}></div></div><div class="row2"><div class="field"><label>開始時刻</label><input type="time" id="r_stime" value="${padTime(r.stime)}" ${ro?'readonly':''}></div><div class="field"><label>終了時刻</label><input type="time" id="r_etime" value="${padTime(r.etime)}" ${ro?'readonly':''}></div></div><div class="allday-row"><label><input type="checkbox" id="r_allday" ${ro?'disabled':''}> 終日</label><span class="note" id="r_allday_note"></span></div><div class="field"><label>備考</label><textarea id="r_note" ${ro?'readonly':''}>${esc(r.note||'')}</textarea></div></div><div class="modal-foot"><div>${(!isNew&&canEdit())?'<button class="btn btn-danger" id="delBtn">この予約を削除</button>':''}</div><div style="display:flex;gap:8px;"><button class="btn btn-ghost" id="cCancel">${ro?'閉じる':'キャンセル'}</button>${!ro?`<button class="btn btn-primary" id="cSave">${isNew?'予約する':'保存する'}</button>`:''}</div></div></div></div>`;
  const g=id=>document.getElementById(id);
  const dt=bindDateTime(ro,r.stime==='終日',{s:'r_start',e:'r_end',st:'r_stime',et:'r_etime',all:'r_allday',note:'r_allday_note'});
  /* 予約者と時間帯の表示（入力に合わせて更新） */
  const updSum=()=>{
    const s=g('r_start').value,e=g('r_end').value||s;
    const period=s?(s===e?fmtMD(s):fmtMD(s)+'〜'+fmtMD(e)):'—';
    const t=dt.isAllDay()?'終日':((g('r_stime').value||'—')+'〜'+(g('r_etime').value||'—'));
    g('r_sum').innerHTML=`<div><b>予約者</b>　${esc(accountName(r.reservedBy)||'—')}</div><div><b>時間帯</b>　${period}　${t}</div>`;
  };
  ['r_start','r_end','r_stime','r_etime','r_allday'].forEach(id=>{g(id).addEventListener('input',updSum);g(id).addEventListener('change',updSum);});
  updSum();
  /* 新規予約：案件を選ぶと、案件の日程・時間・担当者を初期値として反映 */
  if(isNew&&!ro)g('r_prj').addEventListener('change',()=>{
    const pr=PROJECTS.find(x=>x.id===g('r_prj').value);if(!pr)return;
    g('r_start').value=pr.start;g('r_end').value=pr.end;
    g('r_stime').value=padTime(pr.stime);g('r_etime').value=padTime(pr.etime);
    dt.setUserAllDay(pr.stime==='終日');
    if(!g('r_user').value&&pr.assigned[0])g('r_user').value=pr.assigned[0];
    updSum();
  });

  const close=()=>root.innerHTML='';
  g('cX').onclick=close;g('cCancel').onclick=close;
  g('ov').addEventListener('mousedown',e=>{if(e.target.id==='ov')close();});
  if(!isNew&&canEdit())g('delBtn').onclick=()=>{if(!confirm('この予約を削除しますか？'))return;RESERVATIONS=RESERVATIONS.filter(x=>x.id!==r.id);close();renderAll();};
  if(!ro)g('cSave').onclick=()=>{
    const start=g('r_start').value||d0;
    let end=g('r_end').value||start;if(end<start)end=start;
    const allDay=dt.isAllDay();
    const stime=allDay?'終日':g('r_stime').value,etime=allDay?'':g('r_etime').value;
    if(!allDay&&stime&&etime&&etime<=stime){alert('終了時刻は開始時刻より後にしてください。');return;}
    const rec={equipmentId:g('r_eq').value,userId:g('r_user').value,projectId:g('r_prj').value,qty:Math.max(1,Number(g('r_qty').value)||1),start,end,stime,etime,note:g('r_note').value};
    let saved;
    if(isNew){saved=Object.assign({id:'r'+(nextRid++),reservedBy:state.currentUserId},rec);RESERVATIONS.push(saved);}
    else{Object.assign(r,rec);saved=r;}
    close();renderAll();
    warnStock(saved);
  };
}

/* ── 全体描画 ──
   再描画（ドラッグ&ドロップ・保存など）でスクロール位置が初期位置に戻らないよう、
   同じ画面(タブ+表示)のままなら scrollLeft/scrollTop を復元する。日付移動・「今日」のときは横位置だけ先頭に戻す。 */
let lastScrollKey=null,forceResetScroll=false;
function renderAll(){
  const w=document.querySelector('.cal-wrap');
  const key=state.tab+'|'+(state.tab==='eq'?state.eqView:state.view);
  let keep=(w&&lastScrollKey===key)?{l:w.scrollLeft,t:w.scrollTop}:null;
  if(keep&&forceResetScroll)keep.l=0;
  forceResetScroll=false;
  renderTopbar();
  if(state.tab==='cal'){if(state.view==='month')renderMonth();else if(state.view==='day')renderDay24();else renderWeek();}
  else if(state.tab==='eq')renderEquipmentCal();
  else if(state.tab==='settings')renderSettings();
  const w2=document.querySelector('.cal-wrap');
  lastScrollKey=w2?key:null;
  if(keep&&w2){w2.scrollLeft=keep.l;w2.scrollTop=keep.t;}
}

/* ── ナビ ── */
document.querySelectorAll('.navbtn').forEach(b=>b.addEventListener('click',()=>{
  document.querySelectorAll('.navbtn').forEach(x=>x.classList.remove('active'));
  b.classList.add('active');state.tab=b.dataset.tab;renderAll();
}));
const ubox=document.getElementById('userbox');
document.getElementById('userAvatar').addEventListener('click',e=>{e.stopPropagation();ubox.classList.toggle('open');});
document.addEventListener('click',()=>ubox.classList.remove('open'));
</script>
